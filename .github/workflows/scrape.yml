name: scrape
on:
  schedule: [{ cron: "17 */6 * * *" }] # every 6h; Remotive asks for <=4 fetches/day
  workflow_dispatch:
  push: # a front-end fix goes live within minutes instead of at the next 6-hourly run: only the deploy job runs, no scrape
    branches: [main]
    paths: ["web/**", "build_site.py", "build_pages.py", "build_logos.py"]
permissions:
  contents: write
concurrency: scrape
jobs:
  scrape:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
        total: [6]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pillow
      - env: # optional: US federal jobs; unset secrets arrive empty and the source is skipped
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
        run: python test_scraper.py && python scraper.py --shard ${{ matrix.shard }} --total-shards ${{ matrix.total }}
      - name: Upload Shard Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: data/shards/shard-${{ matrix.shard }}
          retention-days: 1

  consolidate:
    needs: scrape
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pillow
      - name: Download all shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: data/shards
      - name: Consolidate data and generate charts
        run: python scraper.py --consolidate && python make_charts.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if ! git diff --cached --quiet; then
            git commit -m "data: $(date -u '+%F %H:%M') UTC"
            for try in 1 2 3; do
              git pull --rebase -X theirs -q && git push && exit 0
              git rebase --abort 2>/dev/null || true
              sleep 10
            done
            exit 1
          fi

  deploy: # rebuild the Pages site from the freshly committed data
    needs: [scrape, consolidate]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }} # a push skips the scrape job; a failed scrape still stops the deploy
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write, contents: read }
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main } # not the triggering sha: the bot commit above is newer
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pillow
      - run: python build_site.py
      - id: month
        run: echo "ym=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4 # company icons are fetched once a month, not on every 6-hourly deploy
        with:
          path: logo-cache
          key: logos-${{ steps.month.outputs.ym }}-${{ hashFiles('domains.json', 'companies.json') }}
          restore-keys: logos-
        continue-on-error: true
      - run: python build_logos.py
      - run: python build_pages.py # crawlable field/company pages, sitemap.xml
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: d
        uses: actions/deploy-pages@v4
      - name: Update the About text # the open-job figure in the repo description. GITHUB_TOKEN may not edit repo settings, so this needs a fine-grained token (Administration: read and write) in the ABOUT_TOKEN secret; without one it is skipped
        continue-on-error: true # never fails a deploy
        env:
          GH_TOKEN: ${{ secrets.ABOUT_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -n "$GH_TOKEN" ]; then python update_about.py; else echo "ABOUT_TOKEN is not set: leaving the About text alone"; fi
