name: scrape
on:
  schedule: [{ cron: "17 */6 * * *" }] # every 6h; Remotive asks for <=4 fetches/day
  workflow_dispatch:
permissions:
  contents: write
concurrency: scrape
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python test_scraper.py && python scraper.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "data: $(date -u '+%F %H:%M') UTC"
            git push
          fi
