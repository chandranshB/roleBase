name: kaggle
on:
  schedule: [{ cron: "40 2 * * *" }] # daily; scrape.yml commits every 6h
  workflow_dispatch:
    inputs:
      sync_only: { description: "Only refresh the dataset page (description, tags, cover), no new data version", type: boolean, default: false }
permissions:
  contents: read
concurrency: kaggle
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }} # new-style KGAT_ token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests kaggle
      - run: python export_kaggle.py
      - name: Publish new dataset version (creates it, private, on first run)
        if: env.KAGGLE_API_TOKEN != '' && !inputs.sync_only
        run: |
          for try in 1 2 3; do  # Kaggle's API sometimes answers with an empty body; a retry at worst makes one extra version
            kaggle datasets version -p kaggle -m "auto $(date -u +%F)" && exit 0
            sleep 20
          done
          kaggle datasets create -p kaggle  # only the very first run gets here: the dataset does not exist yet
      - name: Sync subtitle, tags, sources and cover image
        if: env.KAGGLE_API_TOKEN != ''
        env:
          SYNC_ONLY: ${{ inputs.sync_only }}
        run: |
          [ "$SYNC_ONLY" = true ] || sleep 45  # give Kaggle time to start the new version, else status still reports the old one as ready
          for _ in $(seq 30); do  # wait until the new version is built, else the update hits the old one
            [ "$(kaggle datasets status "$KAGGLE_USERNAME/job-listings")" = ready ] && break
            sleep 10
          done
          # Kaggle answers with an empty body when this call is slow (it did on all three tries when the cover and the per-column descriptions went
          # together), so: first the text and the file/column descriptions, then the cover on its own, without the descriptions. Each is retried
          # and only warns: the data is published already. (Kaggle may still drop the column descriptions, kaggle-cli#1207; export_kaggle.py also
          # writes them into the dataset description.)
          mkdir sync-text sync-cover
          cp kaggle/dataset-metadata.json sync-text/
          python -c "import json; m = json.load(open('kaggle/dataset-metadata.json')); m.pop('resources'); json.dump(m, open('sync-cover/dataset-metadata.json', 'w'))"
          cp kaggle/dataset-cover-image.png sync-cover/
          sync() {
            local t=$SECONDS
            kaggle datasets metadata --update -p "$1" "$KAGGLE_USERNAME/job-listings" && { echo "$1 synced in $((SECONDS - t)) s"; return 0; }
            echo "$1 failed after $((SECONDS - t)) s"; return 1
          }
          for what in text cover; do
            for try in 1 2 3; do
              sync "sync-$what" && continue 2
              sleep 20
            done
            echo "::warning title=kaggle $what::sync failed three times, the next run tries again"
          done
      - name: Publish the starter notebook (public, shows under the dataset Code tab)
        if: env.KAGGLE_API_TOKEN != ''
        run: kaggle kernels push -p kaggle_notebook || echo "notebook push failed, not fatal"
