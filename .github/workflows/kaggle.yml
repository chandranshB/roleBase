name: kaggle
on:
  schedule: [{ cron: "40 2 * * *" }] # daily; scrape.yml commits every 6h
  workflow_dispatch:
permissions:
  contents: read
concurrency: kaggle
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }} # new-style KGAT_ token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests kaggle
      - run: python export_kaggle.py
      - name: Publish new dataset version (creates it, private, on first run)
        if: env.KAGGLE_API_TOKEN != ''
        run: kaggle datasets version -p kaggle -m "auto $(date -u +%F)" || kaggle datasets create -p kaggle
      - name: Sync subtitle, tags, sources, file/column descriptions and cover image
        if: env.KAGGLE_API_TOKEN != ''
        run: |
          sleep 30  # let the new version register first
          kaggle datasets metadata --update -p kaggle "$KAGGLE_USERNAME/job-listings"
