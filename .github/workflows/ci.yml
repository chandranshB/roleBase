name: ci

on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.py"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Code quality check (ruff)
        run: |
          ruff check rolebase tests --output-format=github

      - name: Run unit test suite
        run: |
          python -m unittest discover tests -v

      - name: Run legacy regression checks
        run: |
          python test_scraper.py

      - name: Verify compilation of build scripts
        run: |
          python -m py_compile build_site.py build_logos.py build_pages.py export_kaggle.py
